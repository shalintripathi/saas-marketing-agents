name: Lint Agents

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/lint-agents.sh'
      - '.github/workflows/lint-agents.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/lint-agents.sh'
      - '.github/workflows/lint-agents.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Agent Files
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint all agent persona files
        run: |
          set -euo pipefail
          # The 75 canonical agent personas live in these 17 category directories.
          # (strategy/ holds framework docs, not agents, so it is not linted here.)
          dirs="content seo paid-media social email design sales product-marketing abm growth analytics comms partnerships events developer-marketing project-management client-ops"
          count=0
          fail=0
          while IFS= read -r file; do
            count=$((count + 1))
            if ! bash scripts/lint-agents.sh "$file"; then
              fail=$((fail + 1))
            fi
          done < <(find $dirs -name '*.md' -type f | sort)
          echo "Linted $count agent files; $fail failed."
          if [ "$fail" -ne 0 ]; then
            echo "::error::$fail agent file(s) failed validation."
            exit 1
          fi
          echo "All agent files passed linting checks ✓"
